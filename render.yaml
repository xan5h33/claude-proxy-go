databases:
  - name: claude-proxy-db
    databaseName: proxy
    user: proxy
    plan: free

services:
  - type: web
    name: claude-proxy-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: claude-proxy-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 8080
      - key: INIT_ADMIN_EMAIL
        sync: false
      - key: INIT_ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
