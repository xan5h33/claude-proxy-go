services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: proxy
      POSTGRES_USER: proxy
      POSTGRES_PASSWORD: proxy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://proxy:proxy@db:5432/proxy?sslmode=disable
      ADMIN_SECRET: secret123
      PORT: 8080
    depends_on:
      - db

volumes:
  pgdata:
